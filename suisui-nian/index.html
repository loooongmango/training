<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥭💭 碎碎念</title>
<style>
  :root{
    --bg:#FFF6EA; --mango:#FF9F1C; --mango-deep:#E8830C;
    --text:#4A3728; --muted:#A08B76;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding:20px 16px 60px;max-width:700px;margin:0 auto}
  .back{display:inline-block;margin-bottom:8px;color:#E8830C;text-decoration:none;font-size:14px;font-weight:700}
  .hero{text-align:center;margin-bottom:14px}
  .hero h1{font-size:25px}
  .hero .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
  .cell{background:none;border:none;font-size:19px;line-height:1;cursor:pointer;
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    transition:transform .12s}
  .cell:active{transform:scale(1.5)}
  .cell.done{filter:drop-shadow(0 0 3px rgba(255,159,28,.8))}
  @media(max-width:560px){.cell{font-size:14px}}
  .modal{display:none;position:fixed;inset:0;background:rgba(74,55,40,.45);z-index:50;
    align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .mbox{background:#FFFDF8;border-radius:20px;padding:22px;max-width:420px;width:100%;
    box-shadow:0 12px 40px rgba(120,80,30,.25);text-align:center}
  .mbox .mtech{font-size:13px;color:var(--mango-deep);font-weight:700}
  .mbox .memoji{font-size:52px;margin:10px 0 4px}
  .mbox .mtitle{font-size:15px;font-weight:800;margin-bottom:10px;color:var(--muted)}
  .mbox .mnote{font-size:17px;line-height:1.8;background:var(--bg);border-radius:12px;
    padding:16px 14px;min-height:80px;white-space:pre-wrap}
  .mbox .mnote.empty{color:var(--muted)}
  .mbox button{margin-top:16px;width:100%;padding:12px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#FFB627,#FF8A3D);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .foot{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
  <a class="back" href="../">← 🥭 训练基地</a>
  <div class="hero">
    <h1>💭 碎碎念</h1>
    <div class="sub">400 个格子，随便点开一个</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbox">
      <div class="mtech">💭 碎碎念</div>
      <div class="memoji" id="memoji"></div>
      <div class="mtitle" id="mtitle"></div>
      <div class="mnote empty" id="mnote">（空空如也）</div>
      <button onclick="closeModal()">关闭</button>
    </div>
  </div>

  <p class="foot">🥭⭐ 两个 Muse / 两人共同维护 · 更新只需 push 到仓库，约 1 分钟后页面自动刷新</p>

<script>

"🥭", "🥭", "⭐"];

// 每个格子的自定义文字，key 是格子序号（0-399），初始全空。
// 想写哪格就告诉 ivy，比如「第3行第5列写……」
const notes = {
};

const grid = document.getElementById('grid');
CELLS.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'cell' + (notes[i] ? ' done' : '');
  b.textContent = e;
  b.onclick = () => openCell(i);
  grid.appendChild(b);
});

function openCell(i){
  const r = Math.floor(i / 20) + 1, c = (i % 20) + 1;
  document.getElementById('memoji').textContent = CELLS[i];
  document.getElementById('mtitle').textContent = '第' + r + '行第' + c + '个';
  const note = document.getElementById('mnote');
  if (notes[i]) { note.textContent = notes[i]; note.classList.remove('empty'); }
  else { note.textContent = '（空空如也）'; note.classList.add('empty'); }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
</script>
</body>
</html>
