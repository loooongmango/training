<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥭💭 碎碎念</title>
<style>
  :root{
    --bg:#FFF6EA; --card:#FFFFFF; --mango:#FF9F1C; --mango-deep:#E8830C;
    --text:#4A3728; --muted:#A08B76;
    --shadow:0 4px 16px rgba(190,135,60,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding:20px 16px 60px;max-width:880px;margin:0 auto}
  .back{display:inline-block;margin-bottom:8px;color:#E8830C;text-decoration:none;font-size:14px;font-weight:700}
  .hero{text-align:center;margin-bottom:8px}
  .hero h1{font-size:25px}
  .hero .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .tree-wrap{position:relative;max-width:560px;margin:10px auto 0}
  .tree-wrap img{width:100%;height:auto;display:block;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
  .fruit{position:absolute;transform:translate(-50%,-50%);font-size:36px;cursor:pointer;
    background:none;border:none;padding:6px;filter:drop-shadow(0 2px 4px rgba(190,135,60,.35));
    animation:bob 2.4s ease-in-out infinite}
  .fruit:active{transform:translate(-50%,-50%) scale(1.35) rotate(10deg)}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}
  .modal{display:none;position:fixed;inset:0;background:rgba(74,55,40,.45);z-index:50;
    align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .mbox{background:#FFFDF8;border-radius:20px;padding:22px;max-width:420px;width:100%;
    box-shadow:0 12px 40px rgba(120,80,30,.25);text-align:center}
  .mbox .mtech{font-size:13px;color:var(--mango-deep);font-weight:700}
  .mbox .memoji{font-size:52px;margin:10px 0 4px}
  .mbox .mtitle{font-size:18px;font-weight:800;margin-bottom:10px}
  .mbox .mnote{font-size:22px;font-weight:800;line-height:1.7;background:var(--bg);
    border-radius:12px;padding:16px 14px}
  .mbox button{margin-top:16px;width:100%;padding:12px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#FFB627,#FF8A3D);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .foot{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
  <a class="back" href="../">← 🥭 训练基地</a>
  <div class="hero">
    <h1>💭 碎碎念</h1>
    <div class="sub">点一点树上的芒果和星星</div>
  </div>

  <div class="tree-wrap" id="treeWrap">
    <img src="../assets/tree.png" alt="芒果树">
  </div>

  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbox">
      <div class="mtech">💭 碎碎念</div>
      <div class="memoji" id="memoji"></div>
      <div class="mtitle" id="mtitle"></div>
      <div class="mnote">嘿嘿嘿</div>
      <button onclick="closeModal()">关闭</button>
    </div>
  </div>

  <p class="foot">🥭⭐ 两个 Muse / 两人共同维护 · 更新只需 push 到仓库，约 1 分钟后页面自动刷新</p>

<script>
// 树上的果子：emoji + 在图上的位置（百分比）+ 标题
const fruits = [
  { e:"⭐", x:52, y:22, t:"树顶的星星" },
  { e:"🥭", x:40, y:35, t:"芒果一号" },
  { e:"🥭", x:70, y:35, t:"芒果二号" },
  { e:"⭐", x:55, y:51, t:"树中央的星星" },
  { e:"⭐", x:55, y:61, t:"下面的星星" },
  { e:"🥭", x:37, y:69, t:"芒果三号" },
];
const wrap = document.getElementById('treeWrap');
fruits.forEach((f,i) => {
  const b = document.createElement('button');
  b.className = 'fruit';
  b.textContent = f.e;
  b.style.left = f.x + '%';
  b.style.top = f.y + '%';
  b.style.animationDelay = (i * 0.35) + 's';
  b.onclick = () => openFruit(i);
  wrap.appendChild(b);
});

function openFruit(i){
  const f = fruits[i];
  document.getElementById('memoji').textContent = f.e;
  document.getElementById('mtitle').textContent = f.t;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
</script>
</body>
</html>
